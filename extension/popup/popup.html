<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Web Job Scraper</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <img src="../icons/icon.svg" alt="" width="22" height="22">
    <h1>Web Job Scraper</h1>
    <span id="version" class="version"></span>
  </header>
  <section class="garden" aria-label="Your fox and garden: one flower per job still to collect">
    <canvas id="garden" width="340" height="116"></canvas>
  </section>
  <main>
    <section id="sites"></section>
    <div class="actions">
      <button id="save-now" type="button">Save now</button>
      <button id="check-update" type="button">Check for updates</button>
    </div>
    <section id="needs-look">
      <h2>Needs a look <span id="needs-count"></span></h2>
      <p class="hint">These jobs had no location on their card. Open one to capture its full details.</p>
      <ul id="needs-list"></ul>
    </section>
    <section class="pet-settings">
      <h2>Fox</h2>
      <label><input id="pet-enabled" type="checkbox"> Show on LinkedIn job pages</label>
      <label>Speed
        <select id="pet-speed">
          <option value="calm">Calm</option>
          <option value="normal">Normal</option>
          <option value="playful">Playful</option>
        </select>
      </label>
    </section>
    <div class="actions">
      <button id="save-page" type="button" title="Saves the job page in the open tab to web-job-scraper\debug in your downloads folder so capture can be fixed">Save this page for fixing</button>
    </div>
    <p id="message" role="status"></p>
  </main>
  <script src="../pet/sprites.js"></script>
  <script src="../pet/pet.js"></script>
  <script src="popup.js"></script>
</body>
</html>
